[workspace]
members = [
    ".",
    "crates/ztracing_macro",
    "crates/ztracing",
    "crates/zlog",
    "crates/util",
    "crates/sum_tree",
    "crates/rope",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Internal crates
ztracing_macro = { path = "crates/ztracing_macro" }
ztracing = { path = "crates/ztracing" }
zlog = { path = "crates/zlog" }
sum_tree = { path = "crates/sum_tree" }
rope = { path = "crates/rope" }
util = { path = "crates/util" }

# External dependencies
tracing = "0.1"
tracing-subscriber = "0.3"
heapless = "0.9.2"
rayon = "1.10"
log = "0.4"
unicode-segmentation = "1.12"
rand = "0.8"
ctor = "0.2"
proptest = "1.5"

[package]
name = "crest_editor_engine"
version = "0.1.0"
edition = "2021"
authors = ["CrestCode Team"]
description = "Native high-performance Rust Editor Engine for CrestCode"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
zed-rope = ["dep:rope", "dep:sum_tree"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"
crossbeam-channel = "0.5"
rope = { path = "crates/rope", optional = true }
sum_tree = { path = "crates/sum_tree", optional = true }

[dev-dependencies]
tempfile = "3.8"
