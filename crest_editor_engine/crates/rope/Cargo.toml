[package]
name = "rope"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/rope.rs"

[dependencies]
heapless.workspace = true
log.workspace = true
rayon.workspace = true
sum_tree.workspace = true
unicode-segmentation.workspace = true
util = { path = "../../crates/util", features = ["test-support"] }
ztracing.workspace = true
tracing.workspace = true

[dev-dependencies]
ctor.workspace = true
rand.workspace = true
zlog = { path = "../../crates/zlog", features = ["test-support"] }

[[bench]]
name = "rope_benchmark"
harness = false

[package.metadata.cargo-machete]
ignored = ["tracing"]
