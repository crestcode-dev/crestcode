name: Android CI

# ─────────────────────────────────────────────────────────────
# Primary Android app CI — builds JDK + Rust engine + APK.
# For dedicated Rust unit tests and zed-rope integration,
# see .github/workflows/engine-ci.yml
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [ experiment/c-editor-engine, main, master ]
  pull_request:
    branches: [ experiment/c-editor-engine, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crest_editor_engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crest_editor_engine/Cargo.toml', 'crest_editor_engine/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android NDK Environment
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "::error::No Android NDK found under $ANDROID_HOME/ndk/"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Found Android NDK at: $NDK_PATH"

      - name: Install cargo-ndk (cached)
        uses: actions/cache@v4
        id: cargo-ndk-cache
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-latest
      - name: Build cargo-ndk if not cached
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Run Rust Engine Unit Tests
        run: |
          cd crest_editor_engine
          cargo test

      - name: Build Rust Native Engine for Android arm64-v8a
        run: |
          cd crest_editor_engine
          cargo ndk -t arm64-v8a build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcrest_editor_engine.so \
             ../app/src/main/jniLibs/arm64-v8a/libcrest_editor.so

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crestcode-debug
          path: app/build/outputs/apk/debug/app-debug.apk
