name: Rust Engine CI

# ─────────────────────────────────────────────────────────────
# Separate, isolated CI pipeline for crest_editor_engine.
# Runs Rust unit tests (native), cargo check with Zed-Rope
# feature, and an Android arm64-v8a cross-compile.
# Does NOT depend on, nor break, the existing Android CI job.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [ experiment/c-editor-engine, main, master ]
    paths:
      - 'crest_editor_engine/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [ experiment/c-editor-engine, main, master ]
    paths:
      - 'crest_editor_engine/**'
      - '.github/workflows/engine-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: crest_editor_engine

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Prevent cargo from reaching out for doc tests that aren't needed
  CARGO_INCREMENTAL: 0

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Native unit tests + feature checks
  # Fast, runs on the host toolchain to validate logic
  # ──────────────────────────────────────────────────────────
  rust-test:
    name: Rust Tests (native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Also install clippy and rustfmt for lint checks
          components: clippy, rustfmt

      # ── Cargo dependency cache ──────────────────────────
      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crest_editor_engine/target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('crest_editor_engine/Cargo.toml', 'crest_editor_engine/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-

      # ── Format check (non-blocking lint) ────────────────
      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      # ── Build: default features (no Zed rope) ───────────
      - name: cargo check (default features)
        run: cargo check --all-targets

      # ── Build: zed-rope feature ─────────────────────────
      - name: cargo check (zed-rope feature)
        run: cargo check --all-targets --features zed-rope

      # ── Unit tests (native, default features) ────────────
      - name: Run unit tests
        run: cargo test --verbose

      # ── Unit tests with Zed Rope enabled ─────────────────
      - name: Run unit tests (zed-rope feature)
        run: cargo test --verbose --features zed-rope

      # ── Clippy lint ──────────────────────────────────────
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # Job 2: Android arm64-v8a cross-compile
  # Builds the .so and prepares jniLibs artefact
  # ──────────────────────────────────────────────────────────
  android-build:
    name: Android arm64-v8a Build
    runs-on: ubuntu-latest
    needs: rust-test          # Only cross-compile if native tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain (+ Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ── Android NDK setup ────────────────────────────────
      - name: Resolve Android NDK path
        id: ndk
        run: |
          NDK_PATH=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "::error::No Android NDK found under $ANDROID_HOME/ndk/"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH"         >> "$GITHUB_ENV"
          echo "ndk_path=$NDK_PATH"         >> "$GITHUB_OUTPUT"
          echo "Found NDK: $NDK_PATH"

      # ── Cargo dependency cache (Android target) ──────────
      - name: Cache Cargo registry & Android build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crest_editor_engine/target/aarch64-linux-android
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('crest_editor_engine/Cargo.toml', 'crest_editor_engine/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # ── Install cargo-ndk ────────────────────────────────
      - name: Install cargo-ndk (cached)
        uses: actions/cache@v4
        id: cargo-ndk-cache
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-latest
      - name: Build cargo-ndk if not cached
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      # ── Cross-compile default features ───────────────────
      - name: Build .so for Android arm64-v8a (default features)
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 26 \
            -- build --release

      # ── Cross-compile with zed-rope feature ──────────────
      - name: Build .so for Android arm64-v8a (zed-rope feature)
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 26 \
            -- build --release --features zed-rope

      # ── Copy .so to jniLibs staging dir ──────────────────
      - name: Stage jniLibs artefact
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p staging/jniLibs/arm64-v8a
          cp crest_editor_engine/target/aarch64-linux-android/release/libcrest_editor_engine.so \
             staging/jniLibs/arm64-v8a/libcrest_editor.so
          echo "Staged:"
          ls -lh staging/jniLibs/arm64-v8a/

      # ── Upload .so artefact ───────────────────────────────
      - name: Upload jniLibs artefact
        uses: actions/upload-artifact@v4
        with:
          name: crestcode-jniLibs-arm64-v8a
          path: staging/jniLibs/
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # Job 3: Android App build
  # Downloads the .so artefact, then builds the debug APK
  # Verifies end-to-end integration with the Android project
  # ──────────────────────────────────────────────────────────
  android-app-build:
    name: Android App Build (integration check)
    runs-on: ubuntu-latest
    needs: android-build       # Requires the .so to be ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Download the .so from the android-build job ───────
      - name: Download jniLibs artefact
        uses: actions/download-artifact@v4
        with:
          name: crestcode-jniLibs-arm64-v8a
          path: app/src/main/jniLibs/

      - name: Verify .so is present
        working-directory: ${{ github.workspace }}
        run: |
          echo "jniLibs contents:"
          find app/src/main/jniLibs -type f
          test -f app/src/main/jniLibs/arm64-v8a/libcrest_editor.so

      # ── Gradle cache ─────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        working-directory: ${{ github.workspace }}
        run: chmod +x gradlew

      # ── Build debug APK ───────────────────────────────────
      - name: Build debug APK
        working-directory: ${{ github.workspace }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # ── Upload debug APK ──────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crestcode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
